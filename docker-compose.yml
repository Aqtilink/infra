version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build: ./user-service
    image: user-service:local
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/user_service_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD:-guest}
      SPRING_PROFILES_ACTIVE: prod
      JWK_SET_URI: ${JWK_SET_URI:-https://clerk.aqtilink.live/.well-known/jwks.json}
      ACTIVITY_SERVICE_URL: ${ACTIVITY_SERVICE_URL:-http://activity-service:8081}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-dev-secret-key-change-in-production}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_API_URL: ${CLERK_API_URL:-https://api.clerk.com/v1}
    ports:
      - "8080:8080"

  activity-service:
    build: ./activity_service
    image: activity-service:local
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started
    environment:
      SERVER_PORT: ${SERVER_PORT:-8081}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/activity_service_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD:-guest}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8080}
      SPRING_PROFILES_ACTIVE: prod
      JWK_SET_URI: ${JWK_SET_URI:-https://ethical-anchovy-26.clerk.accounts.dev/.well-known/jwks.json}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-dev-secret-key-change-in-production}
    ports:
      - "8081:8081"

  notification-service:
    build: ./notification-service
    image: notification-service:local
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-8082}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD:-guest}
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8082:8082"
      - "8082:8082"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8081/api/v1}
        VITE_ACTIVITY_API_URL: ${VITE_ACTIVITY_API_URL:-http://localhost:8081/api/v1/activities}
        VITE_USER_API_URL: ${VITE_USER_API_URL:-http://localhost:8080/api/v1/users}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-pk_test_ZXRoaWNhbC1hbmNob3Z5LTI2LmNsZXJrLmFjY291bnRzLmRldiQ}
    image: frontend:local
    depends_on:
      - activity-service
    ports:
      - "5173:80"

volumes:
  postgres-data:
