apiVersion: v1
kind: Namespace
metadata:
  name: aqtilink
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: aqtilink
data:
  spring.datasource.url: jdbc:postgresql://postgres:5432/user_service_db
  spring.datasource.url.activity: jdbc:postgresql://postgres:5432/activity_service_db
  rabbitmq.host: rabbitmq
  rabbitmq.port: "5672"
  user-service.url: http://user-service:8080
  activity-service.url: http://activity-service:8081
  jwk-set-uri: https://clerk.aqtilink.live/.well-known/jwks.json
  clerk.api.url: https://api.clerk.com/v1
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: aqtilink
type: Opaque
data:
  username: cG9zdGdyZXM=  # postgres (base64)
  password: cG9zdGdyZXM=  # postgres (base64)
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: aqtilink
type: Opaque
data:
  username: Z3Vlc3Q=  # guest (base64)
  password: Z3Vlc3Q=  # guest (base64)
---
apiVersion: v1
kind: Secret
metadata:
  name: service-credentials
  namespace: aqtilink
type: Opaque
data:
  api-key: ZGV2LXNlY3JldC1rZXktY2hhbmdlLWluLXByb2R1Y3Rpb24=  # dev-secret-key-change-in-production (base64)
---
apiVersion: v1
kind: Secret
metadata:
  name: clerk-credentials
  namespace: aqtilink
type: Opaque
stringData:
  secret-key: ""  # Set your Clerk secret key here
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: aqtilink
data:
  init.sql: |
    CREATE DATABASE user_service_db;
    CREATE DATABASE activity_service_db;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: aqtilink
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: aqtilink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init-sql
          configMap:
            name: postgres-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aqtilink
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: aqtilink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - containerPort: 5672
            - containerPort: 15672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: aqtilink
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: aqtilink
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: docker.io/casperjes/user-service:latest
          imagePullPolicy: Always
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: spring.datasource.url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: rabbitmq.host
            - name: SPRING_RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: rabbitmq.port
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: JWK_SET_URI
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: jwk-set-uri
            - name: ACTIVITY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: activity-service.url
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: service-credentials
                  key: api-key
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: clerk-credentials
                  key: secret-key
                  optional: true
            - name: CLERK_API_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: clerk.api.url
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: aqtilink
  annotations:
    cloud.google.com/backend-config: '{"default":"user-service-backendconfig"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: NodePort
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: user-service-backendconfig
  namespace: aqtilink
spec:
  healthCheck:
    type: HTTP
    requestPath: /actuator/health
    port: 8080
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: activity-service-backendconfig
  namespace: aqtilink
spec:
  healthCheck:
    type: HTTP
    requestPath: /actuator/health
    port: 8081
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: activity-service
  namespace: aqtilink
spec:
  replicas: 2
  selector:
    matchLabels:
      app: activity-service
  template:
    metadata:
      labels:
        app: activity-service
    spec:
      containers:
        - name: activity-service
          image: docker.io/casperjes/activity-service:latest
          imagePullPolicy: Always
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: spring.datasource.url.activity
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: rabbitmq.host
            - name: SPRING_RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: rabbitmq.port
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: user-service.url
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: JWK_SET_URI
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: jwk-set-uri
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: service-credentials
                  key: api-key
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: activity-service
  namespace: aqtilink
  annotations:
    cloud.google.com/backend-config: '{"default":"activity-service-backendconfig"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector:
    app: activity-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: aqtilink
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: docker.io/casperjes/notification-service:latest
          imagePullPolicy: Always
          env:
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_USERNAME
              value: guest
            - name: SPRING_RABBITMQ_PASSWORD
              value: guest
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sendgrid-secret
                  key: api-key
          ports:
            - containerPort: 8082
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: aqtilink
spec:
  selector:
    app: notification-service
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: aqtilink
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: docker.io/casperjes/aqtilink-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: aqtilink
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: NodePort
